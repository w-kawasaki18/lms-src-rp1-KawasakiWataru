<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>
	
	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">
				
				<!-- 川﨑航 - Task27 エラーメッセージ -->
				<th:block th:if="${#fields.hasErrors('*')}">
					<ul style="padding-left: 0; list-style: none;">
						<li th:each="err : ${#fields.errors('*')}">
							<sapn th:text="'* ' + ${err}" class="help-inline error"></sapn>
						</li>
					</ul>
				</th:block>

				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<th class="w70">出勤</th>
							<th class="w70">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!-- 川﨑航 - Task26 出勤時間 -->
								<td class="w70">
								    <div style="display: flex; align-items: center; gap: 4px; flex-wrap: nowrap;">
										<!-- 川﨑航 - Task27 出勤時間（時）エラー時の赤枠表示 -->
								        <select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|"
								            class="form-control"
								            th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')} ? 'errorInput'"
								            style="width: 70px;">
								            <option th:each="hour : ${attendanceForm.hourMap}"
								                th:value="${hour.key}"
								                th:selected="${hour.key == dailyAttendanceForm.trainingStartTimeHour}">
								                [[${#numbers.formatInteger(hour.key, 2)}]]
								            </option>
								        </select>
								        
								        :
								        
								        <!-- 川﨑航 - Task27 出勤時間（分）エラー時の赤枠表示 -->
								        <select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|"
								            class="form-control"
								            th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMinute')} ? 'errorInput'"
								            style="width: 70px;">
								            <option th:each="minute : ${attendanceForm.minuteMap}"
								                th:value="${minute.key}"
								                th:selected="${minute.key == dailyAttendanceForm.trainingStartTimeMinute}">
								                [[${#numbers.formatInteger(minute.key, 2)}]]
								            </option>
								        </select>
								    </div>
								</td>
								
								<!-- 川﨑航 - Task26 退勤時間 -->
								<td class="w70">
								    <div style="display: flex; align-items: center; gap: 4px; flex-wrap: nowrap;">
										<!-- 川﨑航 - Task27 退勤時間（時）エラー時の赤枠表示 -->
								        <select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|"
								            class="form-control"
								            th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')} ? 'errorInput'"
								            style="width: 70px;">
								            <option th:each="hour : ${attendanceForm.hourMap}"
								                th:value="${hour.key}"
								                th:selected="${hour.key == dailyAttendanceForm.trainingEndTimeHour}">
								                [[${#numbers.formatInteger(hour.key, 2)}]]
								            </option>
								        </select>
								        
								        :
								        
								        <!-- 川﨑航 - Task27 退勤時間（分）エラー時の赤枠表示 -->
								        <select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|"
								            class="form-control"
								            th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMinute')} ? 'errorInput'"
								            style="width: 70px;">
								            <option th:each="minute : ${attendanceForm.minuteMap}"
								                th:value="${minute.key}"
								                th:selected="${minute.key == dailyAttendanceForm.trainingEndTimeMinute}">
								                [[${#numbers.formatInteger(minute.key, 2)}]]
								            </option>
								        </select>
								    </div>
								</td>
								
								<!-- 中抜け時間 -->								
								<td class="w80">
									<!-- 川﨑航 - Task27 中抜け時間エラー時の赤枠表示 -->
									<select th:name="|attendanceList[${stat.index}].blankTime|"
										class="form-control"
										th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? 'errorInput'">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								
								<!-- 備考欄 -->
								<td class="w240">
									<!-- 川﨑航 - Task27 備考エラー時の赤枠表示 -->
									<input type="text"
										   th:name="|attendanceList[${stat.index}].note|"
										   th:value="${dailyAttendanceForm.note}"
										   class="form-control"
										   th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].note')} ? 'errorInput'">
									</input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<!-- 川﨑 - Task27 更新ボタン押下時、ダイアログ表示 id追加 -->
					<input type="submit" value="更新" name="complete" class="btn btn-info" id="updateButton" />
				</div>
			</form>
		</div>
	</div>
	
	<!-- 川﨑 - Task27 更新ボタン押下時、ダイアログ表示 -->
	<script>
		document.getElementById("updateButton").addEventListener("click", function(event) {
			if (!confirm("更新します。よろしいですか？")) {
				event.preventDefault();
			}
		});
	</script>
</body>
</html>
